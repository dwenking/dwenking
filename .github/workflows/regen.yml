name: Regenerate card
on:
  schedule: [{cron: "0 0 * * *"}]   # daily 00:00 UTC
  workflow_dispatch:
  push: {paths: [gen.py]}
permissions: {contents: write}
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pillow && python gen.py
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - run: |
          git config user.name github-actions && git config user.email github-actions@github.com
          git add img/fetch.svg && git diff --cached --quiet || git commit -m "Refresh card" && git push
